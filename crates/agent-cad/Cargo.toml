[package]
name = "agent-cad"
version = "0.5.1"
edition = "2021"
license = "MIT"

[dependencies]
solidcore = { path = "../../vendor/solidcore/crates/solidcore" }
step-brep = { path = "../../vendor/solidcore/crates/step-brep" }
step-import = { path = "../../vendor/solidcore/crates/step-import" }
solidcore-record = { path = "../../vendor/solidcore/crates/solidcore-record" }
solidcore-tess = { path = "../../vendor/solidcore/crates/solidcore-tess" }
rayon = "1.12"
png = "0.17"
step-export = { path = "../../vendor/solidcore/crates/step-export" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
schemars = "1"


[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.10"
