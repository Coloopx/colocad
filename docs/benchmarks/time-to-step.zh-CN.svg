<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 625" role="img" aria-labelledby="title desc"><title id="title">Time to STEP / peak memory</title><desc id="desc">Median wall time and maximum cgroup peak for five fresh builds per backend per object. Absolute values in every row.</desc><rect width="1100" height="625" rx="14" fill="#f6f8f5"/><g font-family="system-ui, Arial, sans-serif"><text x="28" y="38" font-size="16" font-weight="700" fill="#087969">01  /  沙箱内一次 CAD 工具调用</text><text x="28" y="86" font-size="32" font-weight="700" fill="#193f43">从启动工具到拿到 STEP，要等多久？</text><text x="28" y="121" font-size="18" font-weight="400" fill="#193f43">Linux arm64   ·   1 vCPU / 512 MiB   ·   每个零件、每个后端各测 5 次</text><rect x="765" y="22" width="15" height="15" rx="3" fill="#087969"/><text x="787" y="36" font-size="17" font-weight="700" fill="#087969">colocad</text><rect x="906" y="22" width="15" height="15" rx="3" fill="#566d81"/><text x="928" y="36" font-size="17" font-weight="700" fill="#566d81">build123d</text><text x="28" y="172" font-size="18" font-weight="700" fill="#193f43">任务</text><text x="252" y="172" font-size="18" font-weight="700" fill="#193f43">交付 STEP 用时  /  中位数</text><text x="695" y="172" font-size="18" font-weight="700" fill="#193f43">沙箱峰值内存  /  最高值</text><line x1="28" y1="188" x2="1072" y2="188" stroke="#c4d2ce"/><text x="28" y="222" font-size="21" font-weight="700" fill="#193f43">传感器导轨</text><text x="28" y="249" font-size="15" font-weight="400" fill="#55706c">1 个实体</text><rect x="252" y="206" width="7.759" height="13" rx="2" fill="#087969"/><text x="268.75878125" y="219" font-size="16" font-weight="700" fill="#087969">113 ms</text><rect x="695" y="206" width="10.350" height="13" rx="2" fill="#087969"/><text x="714.3495407104492" y="219" font-size="16" font-weight="700" fill="#087969">20.0 MiB</text><rect x="252" y="233" width="170.861" height="13" rx="2" fill="#566d81"/><text x="431.86053084375" y="246" font-size="16" font-weight="700" fill="#566d81">2,485