[workspace]
members = ["crates/agent-cad", "crates/session-catalog"]
exclude = ["vendor/solidcore"]
resolver = "2"

[profile.release]
strip = true

# Whole-program optimization reduces the demand-paged code footprint of the shipped kernel.
[profile.distribution]
inherits = "release"
lto = "fat"
opt-level = 2

# Favor smaller SDK/CLI and exchange code paths. Keep geometry crates at O2.
[profile.distribution.package.agent-cad]
opt-level = "s"
